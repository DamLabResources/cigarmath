[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cigarmath"
version = "0.2.3"
description = "Performs common operations on cigar strings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Will Dampier", email = "wnd22@drexel.edu" },
    { name = "DV Klopfenstein" },
]
keywords = ["cigarmath", "bioinformatics", "CIGAR", "SAM", "BAM", "genomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
io = ["pysam"]
dev = [
    "bump2version",
    "wheel",
    "flake8",
    "coverage",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "twine",
    "pytest",
    "black",
    "pysam",
]

[project.urls]
Homepage = "https://github.com/DamLabResources/cigarmath"
Documentation = "https://cigarmath.readthedocs.io"
Repository = "https://github.com/DamLabResources/cigarmath"
"Bug Tracker" = "https://github.com/DamLabResources/cigarmath/issues"

[tool.setuptools.packages.find]
include = ["cigarmath", "cigarmath.*"]

[tool.pytest.ini_options]
addopts = "--ignore=setup.py"

[tool.flake8]
exclude = ["docs"]
extend-exclude = [".ipynb_checkpoints"]
max-line-length = 120
extend-ignore = ["W291"]

[tool.bumpversion]
current_version = "0.2.3"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "cigarmath/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

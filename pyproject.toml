[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cigarmath"
version = "0.2.3"
description = "Performs common operations on cigar strings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Will Dampier", email = "wnd22@drexel.edu" },
    { name = "DV Klopfenstein" },
]
keywords = ["cigarmath", "bioinformatics", "CIGAR", "SAM", "BAM", "genomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
io = ["pysam"]
dev = [
    "pip",
    "wheel",
    "build",
    "tox",
    "watchdog",
    "flake8",
    "coverage",
    "Sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "twine",
    "pytest",
    "black",
    "pysam",
]

[project.urls]
Homepage = "https://github.com/DamLabResources/cigarmath"
Documentation = "https://cigarmath.readthedocs.io"
Repository = "https://github.com/DamLabResources/cigarmath"
"Bug Tracker" = "https://github.com/DamLabResources/cigarmath/issues"

[tool.setuptools.packages.find]
include = ["cigarmath", "cigarmath.*"]

[tool.pytest.ini_options]

[tool.flake8]
exclude = ["docs"]
extend-exclude = [".ipynb_checkpoints"]
max-line-length = 120
